<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#164b3c" />
  <title>You are offline | StudyFlow</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 20px;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f6f7f3; color: #202d29; }
    main { width: min(460px, 100%); background: #fff; border: 1px solid #e5e9e2; border-radius: 16px; padding: 32px 24px; text-align: center; }
    .icon { display: grid; place-items: center; width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 18px; background: #164b3c; }
    h1 { font-size: 26px; letter-spacing: -.8px; margin: 0 0 12px; }
    p { color: #6c7770; line-height: 1.7; margin: 0 0 12px; font-size: 15px; }
    .actions { display: grid; gap: 10px; margin-top: 24px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 12px 18px; border-radius: 8px; border: 1px solid #dfe5dc;
      background: #fff; color: #1b5543; font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; }
    .btn.primary { background: #164b3c; border-color: #164b3c; color: #fff; }
    .btn:disabled { opacity: .6; cursor: wait; }
    #status { min-height: 22px; font-size: 14px; color: #a05d4e; }
    #status.ok { color: #497141; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.8a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M12 20h.01M3 3l18 18"/></svg>
    </div>
    <h1>You are offline</h1>
    <p>StudyFlow cannot reach the internet right now. Assignments you have already saved and pages you have visited are still available.</p>
    <p id="status" role="status" aria-live="polite"></p>
    <div class="actions">
      <button class="btn primary" id="retry" type="button">Retry connection</button>
      <a class="btn" href="./#/assignments">Open my assignments</a>
    </div>
  </main>
  <script>
    (function () {
      var button = document.getElementById('retry');
      var status = document.getElementById('status');
      button.addEventListener('click', function () {
        button.disabled = true;
        status.className = '';
        status.textContent = 'Checking connection…';
        // A real network request (never answered from the cache) instead of trusting navigator.onLine.
        var controller = new AbortController();
        var timer = setTimeout(function () { controller.abort(); }, 6000);
        fetch('./manifest.json?ping=' + Date.now(), { cache: 'no-store', signal: controller.signal })
          .then(function (response) {
            if (!response.ok) throw new Error('bad status');
            status.className = 'ok';
            status.textContent = 'Connected. Reopening StudyFlow…';
            location.href = './';
          })
          .catch(function () {
            status.className = '';
            status.textContent = 'Still offline. Check your Wi-Fi or mobile data and try again.';
          })
          .then(function () { clearTimeout(timer); button.disabled = false; });
      });
    })();
  </script>
</body>
</html>
